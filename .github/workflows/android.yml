name: Android build
# Fresh verification run after repository signing secrets were added

permissions:
  contents: write


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unblock-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Configure persistent release signing
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/unblock-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unblock-signing/release.jks"
          test -s "$RUNNER_TEMP/unblock-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/unblock-signing/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Validate release keystore credentials safely
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE="$ANDROID_KEYSTORE_PATH"
          echo "Checking keystore file format and store password..."
          if ! keytool -list -keystore "$STORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore cannot be opened. The decoded file and/or ANDROID_KEYSTORE_PASSWORD do not match."
            exit 1
          fi
          echo "Keystore and store password: OK"
          echo "Checking configured key alias..."
          if ! keytool -list -keystore "$STORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS was not found in the keystore, or the keystore credentials are invalid."
            exit 1
          fi
          echo "Key alias: OK"
          echo "Checking private-key password by signing a temporary test file..."
          mkdir -p "$RUNNER_TEMP/signing-check"
          printf 'signing-check\n' > "$RUNNER_TEMP/signing-check/check.txt"
          jar --create --file "$RUNNER_TEMP/signing-check/check.jar" -C "$RUNNER_TEMP/signing-check" check.txt
          if ! jarsigner -keystore "$STORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -signedjar "$RUNNER_TEMP/signing-check/check-signed.jar" "$RUNNER_TEMP/signing-check/check.jar" "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_PASSWORD does not unlock the private key for the configured alias."
            exit 1
          fi
          echo "Private-key password: OK"
      - name: Build permanently signed release APK
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload permanently signed release APK
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unblock-assistant-hardened-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
      - name: Prepare versioned release assets
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING == 'true' }}
        id: release_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/unblock-release.apk
          cd release-assets
          sha256sum unblock-release.apk > unblock-release.apk.sha256
          APK_SHA256=$(cut -d' ' -f1 unblock-release.apk.sha256)
          APK_SIZE_BYTES=$(stat -c '%s' unblock-release.apk)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE_BYTES" >> "$GITHUB_OUTPUT"
      - name: Publish signed APK as the official update release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unblock-v${{ steps.release_version.outputs.name }}-${{ steps.release_version.outputs.code }}
          name: UNBLOCK v${{ steps.release_version.outputs.name }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/unblock-release.apk
            release-assets/unblock-release.apk.sha256
      - name: Publish public update manifest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.release_version.outputs.name }}"
          VERSION_CODE="${{ steps.release_version.outputs.code }}"
          TAG="unblock-v${VERSION_NAME}-${VERSION_CODE}"
          printf '{\n  "versionName": "%s",\n  "versionCode": %s,\n  "apkUrl": "https://github.com/%s/releases/download/%s/unblock-release.apk",\n  "sha256": "%s",\n  "apkSizeBytes": %s,\n  "checksumUrl": "https://github.com/%s/releases/download/%s/unblock-release.apk.sha256"\n}\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_REPOSITORY" "$TAG" \
            "${{ steps.release_version.outputs.sha256 }}" "${{ steps.release_version.outputs.apk_size }}" \
            "$GITHUB_REPOSITORY" "$TAG" > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish update manifest v${VERSION_NAME} [skip ci]"
            git push
          fi
      - name: Explain missing signing secrets
        if: ${{ github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING != 'true' }}
        run: echo "Release APK skipped. Add the four ANDROID_* signing secrets to enable persistent signed releases."
